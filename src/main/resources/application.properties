# Server Configuration
spring.application.name=springaidemo
server.port=8080

# Azure OpenAI Configuration
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:your-api-key}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4}
spring.ai.azure.openai.chat.options.temperature=0.7
spring.ai.azure.openai.chat.options.max-tokens=1000

# Azure AI Search Configuration
spring.ai.azure.store.search.api-key=${AZURE_AI_SEARCH_API_KEY:your-search-key}
spring.ai.azure.store.search.endpoint=${AZURE_AI_SEARCH_ENDPOINT:https://your-search-service.search.windows.net}
spring.ai.azure.store.search.index-name=${AZURE_AI_SEARCH_INDEX_NAME:documents}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.org.springframework.ai=DEBUG
logging.level.com.example.springaidemo=DEBUG
