# Server Configuration
spring.application.name=springaidemo
server.port=8080

# Perplexity.ai
# Open AI and Perplexity use the same ChatModel
spring.ai.openai.base-url=${PERPLEXITY_BASE_URL:https://api.perplexity.ai}
spring.ai.openai.api-key=${PERPLEXITY_API_KEY:your-api-key}
spring.ai.openai.chat.options.model=${PERPLEXITY_MODEL:sonar-pro}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.temperature=0.7
spring.ai.model.embedding=none

# Azure OpenAI Configuration
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:your-api-key}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4}
spring.ai.azure.openai.chat.options.temperature=0.7
spring.ai.azure.openai.chat.options.max-tokens=1000
spring.ai.azure.openai.embedding.options.deployment-name=text-embedding-3-large

# Azure AI Search Configuration
# spring.ai.vectorstore.azure.url=${AZURE_VECTOR_SEARCH_ENDPOINT:https://your-search-service.search.windows.net}
# spring.ai.vectorstore.azure.api-key=${AZURE_VECTOR_SEARCH_API_KEY:your-search-api-key}
# spring.ai.vectorstore.azure.index-name=documents

# Pinecone Vector DB Configuration
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:your-pinecone-api-key}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:your-pinecone-index-name}

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.ai=DEBUG
logging.level.com.exquisiteloop.springaidemo=DEBUG
