<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI Chat Demo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Spring AI Chat Demo</h1>
            <!--/* <p>Powered by Azure OpenAI GPT-4 & Azure AI Search</p> */-->
        </header>

        <div class="chat-options">
			<div th:each="platform, stat : ${aiPlatforms}">
				<label>
					<input type="radio" name="aiPlatform" th:value="${platform}" 
						th:id="${'platform-' + platform}" th:checked="${stat.first}">
					<span th:text="${platform.displayName ?: platform}"></span>
				</label>
			</div>
			<div class="chat-options-right">
				<label for="companySelect">Select Company for RAG:</label>
				<select id="companySelect" name="company">
					<option value=""></option>
					<option th:each="company : ${companies}" th:value="${company.id}" th:text="${company.name}"></option>
				</select>
			</div>
            <!--/* <label>
                <input type="radio" name="chatMode" value="standard" checked>
                Standard Chat
            </label>
            <label>
                <input type="radio" name="chatMode" value="rag">
                Chat with RAG (Retrieval Augmented Generation)
            </label> */-->
        </div>

        <div id="chat-container">
            <div id="messages"></div>
        </div>

        <div class="input-container">
            <textarea id="messageInput" placeholder="Type your message here..." rows="3"></textarea>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>

		<div id="status" class="status"></div>

		<div class="footer">
			<div>
				<strong>POWERED BY</strong>
			</div>
			<div>
				<a href="https://www.exquisiteloop.com" target="_blank">
					<img src="/img/exqloop.png" width="150" height="99" alt="Exquisite Loop">
				</a>
			</div>
			<div style="font-size:8pt">Web Design, Development, and Hosting</div>
		</div>

    </div>

    <script th:src="@{/js/chat.js}"></script>
</body>
</html>
